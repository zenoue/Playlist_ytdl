name: Build APK

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Đổi tên APK
        run: |
          VER=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "dist/PlaylistAudio-${abi}-${VER}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistAudio-apk-${{ github.run_number }}
          path: dist/*.apk
          compression-level: 0

      # Đăng lên Releases để tải thẳng trên điện thoại (không cần giải nén zip)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VER}-build${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Playlist Audio ${VER} (build ${{ github.run_number }})" \
            --notes "Điện thoại phổ thông (2017 trở đi): tải file **arm64-v8a**. Máy rất cũ 32-bit: armeabi-v7a."
