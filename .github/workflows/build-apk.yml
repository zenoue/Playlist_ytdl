name: Build APK

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần lịch sử + tag để viết danh sách thay đổi
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Phiên bản
        run: |
          OFF=$(grep '^betaOffset=' gradle.properties | cut -d= -f2)
          echo "VER=beta_$(( ${{ github.run_number }} - OFF ))" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          APP_VERSION: ${{ env.VER }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Đổi tên APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "dist/PlaylistAudio-${abi}-${VER}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistAudio-apk-${{ github.run_number }}
          path: dist/*.apk
          compression-level: 0

      # Danh sách thay đổi = các commit kể từ bản beta trước
      - name: Danh sách thay đổi
        run: |
          PREV=$(git tag --list 'beta_*' --sort=-v:refname | head -1)
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "## Thay đổi${PREV:+ kể từ $PREV}"
            echo
            git log --no-merges --reverse --format='### %s%n%b' "$RANGE" \
              | grep -v -E '^(Co-Authored-By|Claude-Session):' | cat -s
            echo
            echo "---"
            echo "Cài: tải file **PlaylistAudio-arm64-v8a-${VER}.apk** bên dưới, hoặc mở app → bấm số phiên bản để tự cập nhật."
          } > notes.md
          cat notes.md

      # Đăng lên Releases để tải thẳng trên điện thoại (không cần giải nén zip)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VER}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Playlist Audio ${VER}" \
            --notes-file notes.md
