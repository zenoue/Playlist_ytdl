name: YouTube -> MP3 (cắt, tăng tốc, gộp)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL video/playlist (cách nhau bởi dấu cách). Để trống = đọc urls.txt"
        required: false
        default: ""
      items:
        description: "Chọn video trong playlist (vd 1:10 = 10 video đầu). Trống = tất cả"
        required: false
        default: ""
      trim_start:
        description: "Cắt đầu (giây hoặc mm:ss)"
        default: "0"
      trim_end:
        description: "Cắt cuối (giây hoặc mm:ss)"
        default: "0"
      speed:
        description: "Tốc độ (vd 1.25, 1.5, 2)"
        default: "1.5"
      group_size:
        description: "Số audio gộp thành 1 file"
        default: "10"
      bitrate:
        description: "Bitrate mp3"
        default: "128k"
      release:
        description: "Đăng file lên GitHub Release (giữ lâu dài)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp >= 2025.11 cần JS runtime (Deno) để giải challenge của YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cài ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Ghi cookies (nếu có secret YT_COOKIES)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "COOKIE_ARG=--cookies cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Tải + xử lý
        env:
          URL: ${{ inputs.url }}
        run: |
          python process.py --url "$URL" \
            --trim-start "${{ inputs.trim_start }}" --trim-end "${{ inputs.trim_end }}" \
            --speed "${{ inputs.speed }}" --group-size "${{ inputs.group_size }}" \
            --bitrate "${{ inputs.bitrate }}" --items "${{ inputs.items }}" $COOKIE_ARG
          rm -f cookies.txt

      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_number }}
          path: output/*.mp3
          compression-level: 0
          retention-days: 30

      - name: Tạo Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "audio-${{ github.run_number }}" output/*.mp3 \
            --title "Audio #${{ github.run_number }}" \
            --notes "speed=${{ inputs.speed }}, trim=${{ inputs.trim_start }}/${{ inputs.trim_end }}, group=${{ inputs.group_size }}"
